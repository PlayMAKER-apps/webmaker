name: WebMAKER Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v5
        if: github.repository != 'PlayMAKER-apps/webmaker'
      - name: Compute Pages URL
        id: paths
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          name="${GITHUB_REPOSITORY#*/}"
          if [[ "${name,,}" == "${owner,,}.github.io" ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${name}" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${name}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Validate and build static site
        working-directory: site
        env:
          BASE_PATH: ${{ steps.paths.outputs.base }}
          SITE_URL: ${{ steps.paths.outputs.url }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.repository != 'PlayMAKER-apps/webmaker'
        with:
          path: site/dist
  deploy:
    if: github.repository != 'PlayMAKER-apps/webmaker'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
